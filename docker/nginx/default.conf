server {
    listen 80;
    server_name _;
    root /opt/dental-lab/moslie-dental-lab/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # nginx's default 4k buffer holds the whole response header block. The
        # CSP, Permissions-Policy, Vite preload Link headers and two cookies
        # together exceed it, and nginx answers "upstream sent too big header"
        # with a 502 even though PHP returned 200. 32k leaves plenty of room.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
